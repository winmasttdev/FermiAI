<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tinyllm · Fermi Chat</title>
<style>
  :root { --bg:#0e1116; --panel:#161b22; --bubble:#1f6feb; --you:#30363d; --txt:#e6edf3; --muted:#8b949e; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--txt); height:100vh; display:flex; flex-direction:column; }
  header { padding:12px 18px; background:var(--panel); border-bottom:1px solid #21262d; display:flex; align-items:center; gap:10px; }
  header .dot { width:10px; height:10px; border-radius:50%; background:#3fb950; box-shadow:0 0 8px #3fb950; }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  header small { color:var(--muted); font-weight:400; }
  #log { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:78%; padding:10px 14px; border-radius:14px; line-height:1.5; white-space:pre-wrap; word-wrap:break-word; }
  .user { align-self:flex-end; background:var(--you); border-bottom-right-radius:4px; }
  .bot  { align-self:flex-start; background:var(--bubble); border-bottom-left-radius:4px; }
  .bot .who { font-size:11px; color:#cfe1ff; opacity:.8; margin-bottom:3px; }
  .typing { align-self:flex-start; color:var(--muted); font-style:italic; }
  #bar { display:flex; gap:10px; padding:14px; background:var(--panel); border-top:1px solid #21262d; }
  #in { flex:1; resize:none; background:var(--bg); color:var(--txt); border:1px solid #30363d; border-radius:10px; padding:10px 12px; font:inherit; max-height:120px; }
  #in:focus { outline:none; border-color:var(--bubble); }
  button { background:var(--bubble); color:#fff; border:none; border-radius:10px; padding:0 18px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
<header>
  <span class="dot"></span>
  <h1>tinyllm <small>· chatting from the GTX 550 Ti Fermi (NekoBox)</small></h1>
</header>
<div id="log"></div>
<div id="bar">
  <textarea id="in" rows="1" placeholder="Say something… (Enter to send, Shift+Enter for newline)"></textarea>
  <button id="send">Send</button>
</div>
<script>
const log = document.getElementById('log');
const input = document.getElementById('in');
const sendBtn = document.getElementById('send');
let messages = [];   // {role:'user'|'assistant', content:''}

function addBubble(role, text){
  const d = document.createElement('div');
  d.className = 'msg ' + (role==='user' ? 'user' : 'bot');
  if(role!=='user'){ const w=document.createElement('div'); w.className='who'; w.textContent='FRIEND'; d.appendChild(w); }
  d.appendChild(document.createTextNode(text));
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

async function send(){
  const text = input.value.trim();
  if(!text) return;
  input.value=''; input.style.height='auto';
  messages.push({role:'user', content:text});
  addBubble('user', text);
  const typing = document.createElement('div');
  typing.className='typing'; typing.textContent='FRIEND is thinking on the Fermi…';
  log.appendChild(typing); log.scrollTop=log.scrollHeight;
  sendBtn.disabled = true;
  try{
    const r = await fetch('/api/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({messages})});
    const j = await r.json();
    const reply = j.reply || '(no reply)';
    messages.push({role:'assistant', content:reply});
    typing.remove();
    addBubble('assistant', reply);
  }catch(e){
    typing.remove();
    addBubble('assistant', 'error: '+e);
  }finally{ sendBtn.disabled = false; input.focus(); }
}

sendBtn.onclick = send;
input.addEventListener('keydown', e=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});
input.addEventListener('input', ()=>{ input.style.height='auto'; input.style.height=Math.min(input.scrollHeight,120)+'px'; });
input.focus();
</script>
</body>
</html>
